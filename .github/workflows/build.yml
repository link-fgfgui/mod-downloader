name: Wails Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    name: Verify (test, lint, format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: |
            go.sum
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # node --test only strips TypeScript by default on Node >= 22.18.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -t files < <(find . -name '*.go' -not -path './frontend/node_modules/*')
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "${unformatted}" ]]; then
            echo "Unformatted Go files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Test core module
        run: |
          cd core
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Test root module
        shell: bash
        run: |
          packages=$(go list ./... | grep -v node_modules)
          go test ${packages}
          go vet ${packages}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Test frontend
        run: npm run test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_flags: "-tags webkit2_41"
          - os: windows-latest
            platform: windows
            build_flags: ""
          - os: macos-latest
            platform: darwin
            build_flags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # 🚀 升级到 v6 (原生支持 Node 24)
        with:
          submodules: recursive

      - name: Verify submodules
        run: git submodule status --recursive

      - name: Setup Go
        uses: actions/setup-go@v6 # 🚀 升级到 v6 (原生支持 Node 24)
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: |
            go.sum
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6 # 🚀 升级到 v6 (原生支持 Node 24)
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: bash
        env:
          DEFAULT_CF_API_KEY: ${{ secrets.DEFAULT_CF_API_KEY }}
        run: |
          if [[ -z "${APP_VERSION:-}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              APP_VERSION="${GITHUB_REF_NAME}"
            else
              APP_VERSION="${GITHUB_SHA::12}"
            fi
          fi
          wails build -clean ${{ matrix.build_flags }} -ldflags "-X main.appVersion=${APP_VERSION} -X github.com/link-fgfgui/mod-downloader-core/configs.DefaultCurseforgeAPIKey=${DEFAULT_CF_API_KEY}"

      - name: Package macOS App
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          cd build/bin
          zip -r macos-app.zip *.app
          rm -rf *.app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7 # 🚀 升级到 v7 (原生支持 Node 24)
        with:
          name: wails-artifact-${{ matrix.platform }}
          path: build/bin/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8 # 🚀 升级到 v8 (对应 v7 artifact 的下载器)
        with:
          path: ./artifacts

      - name: Flatten Artifacts Structure
        run: |
          mkdir ./dist
          find ./artifacts -type f -exec cp {} ./dist/ \;
          echo "=== 待发布文件列表 ==="
          ls -l ./dist

      - name: Create and Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
