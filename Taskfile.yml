version: '3'

vars:
  APP_NAME: "mod-downloader"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Link-time injection consumed by the production branch of BUILD_FLAGS in
  # build/Taskfile.yml (server) and build/{linux,windows,darwin}/Taskfile.yml.
  # APP_VERSION: env override > git describe (tag or short hash) > "dev".
  # DEV=true builds skip ldflags entirely and keep the in-source default "dev".
  APP_VERSION:
    sh: 'v="${APP_VERSION:-}"; if [ -n "$v" ]; then printf "%s" "$v"; else git describe --tags --always --dirty 2>/dev/null || printf dev; fi'
  # Built-in CurseForge API key used for outbound requests when the user has
  # none configured (EffectiveCurseForgeAPIKey prefers the user key). Kept out
  # of source control; pass via env for release builds:
  #   DEFAULT_CF_API_KEY=... wails3 task build
  DEFAULT_CF_API_KEY:
    sh: 'printf "%s" "${DEFAULT_CF_API_KEY:-}"'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  clean:artifacts:
    summary: Removes local build outputs and runtime artifacts
    desc: |
      Deletes ignored build outputs (bin/, frontend/dist) and runtime state
      files that tests or manual runs may have left in the repository root
      (log, sqlite, metadata temp). Tracked files are never touched.
    cmds:
      - rm -rf bin frontend/dist
      - rm -f mod-downloader mod-downloader-server mod-downloader.log mod-favs.sqlite mod-metadata.tmp mods.db mods.db-shm mods.db-wal
